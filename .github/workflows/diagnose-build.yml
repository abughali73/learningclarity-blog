name: Diagnose Jekyll build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: gem install github-pages --no-document >/dev/null
      - name: Build
        run: |
          set +e
          github-pages build --verbose > build.log 2>&1 || jekyll build --trace > build.log 2>&1
          code=$?
          grep -n -i -E "error|exception|liquid|warning" build.log | grep -v -i "Requiring\|Reading" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          exit 0
