name: Edit post images

on:
  push:
    branches: [main]
    paths: ["tools/image_edits.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: Apply waiting image edits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
        run: python tools/edit_images.py
      - name: Commit images
        if: always()
        run: |
          git add assets/img/posts
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="LearningClarity Image Bot" -c user.email="actions@users.noreply.github.com" commit -m "images: apply hero image edits"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::Could not push the images after 5 attempts."; exit 1; fi
            sleep $((attempt * 10))
          done
