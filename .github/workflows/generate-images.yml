name: Generate post images

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # hourly safety net: generates any image that is still missing

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: Generate missing images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: ${{ vars.OPENAI_IMAGE_SIZE }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
        run: python tools/generate_images.py
      - name: Commit images and rebuild the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/img/posts
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="LearningClarity Image Bot" -c user.email="actions@users.noreply.github.com" commit -m "images: generate post illustrations"
          # Posts can be pushed while images are generating: rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 5 ]; then echo "::error::Could not push the images after 5 attempts."; exit 1; fi
            sleep $((attempt * 10))
          done
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
