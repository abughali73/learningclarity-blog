name: Generate post images

on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-images
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pillow
      - name: Generate missing images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GEMINI_ASPECT_RATIO: ${{ vars.GEMINI_ASPECT_RATIO }}
        run: python tools/generate_images.py
      - name: Commit images and rebuild the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add assets/img/posts
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git -c user.name="LearningClarity Image Bot" -c user.email="actions@users.noreply.github.com" commit -m "images: generate post illustrations"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with the workflow token do not start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
