name: Generate clip narration

on:
  push:
    branches: [main]
    paths: ["_narration/**", "tools/generate_narration.py"]
  workflow_dispatch:
    inputs:
      only:
        description: "Regenerate every track of this post ref (leave empty for missing tracks only)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: generate-narration
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Speak the missing narration tracks and publish them
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          NARRATION_ONLY: ${{ inputs.only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "LearningClarity Narration Bot"
          git config user.email "actions@users.noreply.github.com"
          set +e
          python tools/generate_narration.py
          status=$?
          set -e
          git add assets/video/features
          if ! git diff --cached --quiet; then
            git commit -q -m "narration: generate feature clip narration"
            for attempt in 1 2 3 4 5; do
              git fetch -q origin main
              git rebase -q origin/main
              if git push -q origin HEAD:main; then break; fi
              if [ "$attempt" = 5 ]; then echo "::error::Could not push the narration after 5 attempts."; exit 1; fi
              sleep $((attempt * 10))
            done
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
          exit $status
