name: Notify blog subscribers

# Emails confirmed subscribers about newly published posts (in their language) through the
# blog-notify Supabase Edge Function, which sends via Microsoft Graph from learningclarity.ai@intellisys.sk.
# Runs hourly at :47, after the image workflow (:17) has had time to add the new post's pictures.
# Turned on by the repository variable BLOG_NOTIFY_ENABLED = true; needs the secret BLOG_NOTIFY_SECRET.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      test_to:
        description: "Send only the newest post to this address (must be learningclarity.ai@intellisys.sk)"
        required: false
        default: ""
      lang:
        description: "Language of the test email (en, ar, es, fr, de)"
        required: false
        default: "en"

permissions:
  contents: read

concurrency:
  group: notify-subscribers
  cancel-in-progress: false

jobs:
  notify:
    if: vars.BLOG_NOTIFY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Send new-post emails
        env:
          ENDPOINT: https://xlkexogyodwnblladuvj.supabase.co/functions/v1/blog-notify
          SECRET: ${{ secrets.BLOG_NOTIFY_SECRET }}
          TEST_TO: ${{ inputs.test_to }}
          TEST_LANG: ${{ inputs.lang }}
        run: |
          if [ -z "$SECRET" ]; then echo "::error::The BLOG_NOTIFY_SECRET repository secret is missing."; exit 1; fi
          if [ -n "$TEST_TO" ]; then
            body=$(jq -nc --arg t "$TEST_TO" --arg l "${TEST_LANG:-en}" '{test_to:$t, lang:$l}')
          else
            body='{}'
          fi
          # The function stops after ~100 s to stay inside its time limit; call again while it says more is left.
          for round in $(seq 1 12); do
            out=$(curl -sS --max-time 150 -X POST "$ENDPOINT" -H "content-type: application/json" -H "x-notify-secret: $SECRET" -d "$body" -w '\n%{http_code}')
            code=$(echo "$out" | tail -n1); res=$(echo "$out" | sed '$d')
            echo "round $round: HTTP $code $res"
            if [ "$code" != "200" ]; then echo "::error::blog-notify answered HTTP $code"; exit 1; fi
            if [ -n "$TEST_TO" ] || [ "$(echo "$res" | jq -r '.remaining // false')" != "true" ]; then break; fi
          done
