title: Learning Clarity Blog
tagline: Clarity in Learning. Success in Every Step.
description: Tips, guides and feature spotlights from LearningClarity, the AI learning platform that explains, quizzes and examines any subject in your language.
url: https://blog.learningclarity.ai
baseurl: ""
lang: en
timezone: Africa/Cairo
locale: en_US
logo: /assets/img/lc-icon.png
author:
  name: Dr. Maher Abu Ghali
  url: https://blog.learningclarity.ai/author/maher-abu-ghali/
default_author: maher
organization:
  name: LearningClarity
  url: https://www.learningclarity.ai
  parent: intelliSYS Solutions & Consulting DWC LLC
# Search engine verification codes (the content="..." value of the HTML meta tag each tool gives you).
verification:
  google: "69ut4Fz2lewNwrlELZhMUq7H9Bs-Cot97jWNigRN7ks"
  bing: "2B4CAC4FC01CF842A5E2985C705BB80A"
social:
  name: LearningClarity
  links:
    - https://www.learningclarity.ai
    - https://apps.apple.com/app/learning-clarity/id6776674430
    - https://play.google.com/store/apps/details?id=ai.learningclarity.app
# Blog languages, in display order. Every post is published in all of them with the same `ref`.
# home: the language's post list. dir: text direction. Posts live in _posts/<code>/.
languages:
  - code: en
    name: English
    locale: en_US
    dir: ltr
    home: /
  - code: ar
    name: العربية
    locale: ar_AR
    dir: rtl
    home: /ar/
  - code: es
    name: Español
    locale: es_ES
    dir: ltr
    home: /es/
  - code: fr
    name: Français
    locale: fr_FR
    dir: ltr
    home: /fr/
  - code: de
    name: Deutsch
    locale: de_DE
    dir: ltr
    home: /de/

markdown: kramdown
future: false

app:
  web: https://www.learningclarity.ai
  ios: https://apps.apple.com/app/learning-clarity/id6776674430
  android: https://play.google.com/store/apps/details?id=ai.learningclarity.app

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  categories:
    - en
    - ar
    - es
    - fr
    - de

defaults:
  - scope:
      path: "_posts/en"
      type: posts
    values:
      layout: post
      lang: en
      locale: en_US
      dir: ltr
      categories: [en]
      author: maher
      permalink: /en/:year/:month/:title/
  - scope:
      path: "_posts/ar"
      type: posts
    values:
      layout: post
      lang: ar
      locale: ar_AR
      dir: rtl
      categories: [ar]
      author: maher
      permalink: /ar/:year/:month/:title/
  - scope:
      path: "_posts/es"
      type: posts
    values:
      layout: post
      lang: es
      locale: es_ES
      dir: ltr
      categories: [es]
      author: maher
      permalink: /es/:year/:month/:title/
  - scope:
      path: "_posts/fr"
      type: posts
    values:
      layout: post
      lang: fr
      locale: fr_FR
      dir: ltr
      categories: [fr]
      author: maher
      permalink: /fr/:year/:month/:title/
  - scope:
      path: "_posts/de"
      type: posts
    values:
      layout: post
      lang: de
      locale: de_DE
      dir: ltr
      categories: [de]
      author: maher
      permalink: /de/:year/:month/:title/
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-default.png

exclude:
  - AGENT.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - package.json
  - package-lock.json
  - node_modules
