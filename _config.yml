title: Learning Clarity Blog
tagline: Clarity in Learning. Success in Every Step.
description: Tips, guides and feature spotlights from LearningClarity, the AI learning platform that explains, quizzes and examines any subject in your language.
url: https://blog.learningclarity.ai
baseurl: ""
lang: en
timezone: Africa/Cairo
locale: en_US
logo: /assets/img/lc-icon.png
author:
  name: Dr. Maher Abu Ghali
  url: https://blog.learningclarity.ai/author/maher-abu-ghali/
default_author: maher
organization:
  name: LearningClarity
  url: https://www.learningclarity.ai
  parent: intelliSYS Solutions and Consulting
# Search engine verification codes (the content="..." value of the HTML meta tag each tool gives you).
verification:
  google: ""
  bing: ""
social:
  name: LearningClarity
  links:
    - https://www.learningclarity.ai
    - https://apps.apple.com/app/learning-clarity/id6776674430
    - https://play.google.com/store/apps/details?id=ai.learningclarity.app
markdown: kramdown
future: false

app:
  web: https://www.learningclarity.ai
  ios: https://apps.apple.com/app/learning-clarity/id6776674430
  android: https://play.google.com/store/apps/details?id=ai.learningclarity.app

plugins:
  - jekyll-feed
  - jekyll-sitemap

feed:
  categories:
    - en
    - ar

defaults:
  - scope:
      path: "_posts/en"
      type: posts
    values:
      layout: post
      lang: en
      locale: en_US
      dir: ltr
      categories: [en]
      author: maher
      permalink: /en/:year/:month/:title/
  - scope:
      path: "_posts/ar"
      type: posts
    values:
      layout: post
      lang: ar
      locale: ar_AR
      dir: rtl
      categories: [ar]
      author: maher
      permalink: /ar/:year/:month/:title/
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/og-default.png

exclude:
  - AGENT.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - package.json
  - package-lock.json
  - node_modules
