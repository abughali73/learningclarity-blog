  short_es: "El Dr. Maher Abu Ghali es doctor en Inteligencia Artificial y Robótica, y fundador y CEO de intelliSYS Solutions & Consulting DWC LLC, la empresa que desarrolla LearningClarity.AI."
  short_fr: "Le Dr Maher Abu Ghali est docteur en intelligence artificielle et robotique, et fondateur et PDG d'intelliSYS Solutions & Consulting DWC LLC, l'entreprise qui développe LearningClarity.AI."
  short_de: "Dr. Maher Abu Ghali ist promoviert in Künstlicher Intelligenz und Robotik sowie Gründer und CEO von intelliSYS Solutions & Consulting DWC LLC, dem Unternehmen hinter LearningClarity.AI."
  bio_es:
    - "El Dr. Maher Abu Ghali es doctor en Inteligencia Artificial y Robótica. Es fundador y CEO de intelliSYS Solutions & Consulting DWC LLC, la empresa propietaria y desarrolladora de la plataforma de aprendizaje LearningClarity.AI."
    - "Cuenta con más de 30 años de experiencia en el diseño y la implantación de grandes sistemas de software para gobiernos y organizaciones internacionales. Durante 18 años trabajó en la Oficina de las Naciones Unidas contra la Droga y el Delito (UNODC), los últimos 14 como Arquitecto Jefe de Software, donde dirigió el diseño y el desarrollo de goAML, el sistema contra el blanqueo de capitales que utilizan las unidades de inteligencia financiera de todo el mundo."
    - "Estudió informática en la Universidad Americana de El Cairo, donde su proyecto de fin de carrera en robótica móvil autónoma fue un sistema de comportamiento que permitía a un grupo de robots aprender a coordinar tareas en un entorno cambiante. Es Chartered IT Professional (MBCS CITP) de BCS, The Chartered Institute for IT."
  bio_fr:
    - "Le Dr Maher Abu Ghali est docteur en intelligence artificielle et robotique. Il est le fondateur et PDG d'intelliSYS Solutions & Consulting DWC LLC, l'entreprise qui possède et développe la plateforme d'apprentissage LearningClarity.AI."
    - "Il compte plus de 30 ans d'expérience dans la conception et la mise en œuvre de grands systèmes logiciels pour des gouvernements et des organisations internationales. Pendant 18 ans, il a travaillé à l'Office des Nations Unies contre la drogue et le crime (ONUDC), dont les 14 dernières années comme architecte logiciel en chef, où il a dirigé la conception et le développement de goAML, le système de lutte contre le blanchiment d'argent utilisé par les cellules de renseignement financier du monde entier."
    - "Il a étudié l'informatique à l'Université américaine du Caire, où son projet de fin d'études en robotique mobile autonome était un système comportemental permettant à un groupe de robots d'apprendre à coordonner leurs tâches dans un environnement changeant. Il est Chartered IT Professional (MBCS CITP) de BCS, The Chartered Institute for IT."
  bio_de:
    - "Dr. Maher Abu Ghali ist promoviert in Künstlicher Intelligenz und Robotik. Er ist Gründer und CEO von intelliSYS Solutions & Consulting DWC LLC, dem Unternehmen, dem die Lernplattform LearningClarity.AI gehört und das sie entwickelt."
    - "Er verfügt über mehr als 30 Jahre Erfahrung in der Konzeption und Umsetzung großer Softwaresysteme für Regierungen und internationale Organisationen. 18 Jahre lang arbeitete er beim Büro der Vereinten Nationen für Drogen- und Verbrechensbekämpfung (UNODC), die letzten 14 davon als Chief Software Architect. Dort leitete er Konzeption und Entwicklung von goAML, dem System zur Bekämpfung der Geldwäsche, das Financial Intelligence Units weltweit einsetzen."
    - "Er studierte Informatik an der American University in Cairo. Sein Abschlussprojekt in autonomer mobiler Robotik war ein Verhaltenssystem, mit dem eine Gruppe von Robotern lernte, ihre Aufgaben in einer sich verändernden Umgebung zu koordinieren. Er ist Chartered IT Professional (MBCS CITP) von BCS, The Chartered Institute for IT."
