# Source of truth for blog posts. Every claim in a post must come from the facts below.
# Keep this file in sync with the LearningClarity User Features Guide.
- key: upload-material
  name: Learn from your own material
  facts:
    - Uploading your own material is open to every account, including during the free first week.
    - "Upload PDF, Word (.docx), PowerPoint (.pptx), plain text (.txt) and Markdown (.md) files, and images (PNG, JPG or JPEG); several files can go into one upload. The size limits are shown on the upload screen."
    - Use your phone's camera to photograph handwritten notes, printed notes or a whole chapter page by page, and upload the photos. Scanned pages and photos are read automatically; clear, well-lit pages work best, and a page with no readable text can't be used.
    - Scanned PDFs are read too. Password-protected PDFs cannot be read.
    - Paste a link to an ordinary web page, such as an article, and LearningClarity builds learning content from it.
    - Depending on how much material you give it, LearningClarity creates a single topic, a course of several topics, or a learning plan of several courses.
    - LearningClarity follows the material's own structure (its table of contents, headings or slide titles), so the subtopics match your material and the lessons use its own examples.
    - You can add notes for the AI and choose the learning language before creating the content.
    - Lets learners study exactly what their course or employer requires.
    - Audio and video files (including lecture recordings) and YouTube links can't be used as sources for an upload.
    - For now the new upload features (Word, PowerPoint and Markdown files, photos and scans, web page links, topic/course/plan sizing) are in the web app only; they are coming to the iPhone and Android apps later.
- key: describe-topic
  name: Create a topic by describing it
  facts:
    - Type the subject you want to learn (up to 5,000 characters), optionally with goals or level.
    - LearningClarity builds the topic, assigns a category and generates its subtopics.
    - The topic is created in the background; you can leave the screen and a banner tells you when it is ready.
    - The fastest and most economical way to start.
    - You choose which subtopics to focus on; completion is tracked for each one.
- key: ai-courses
  name: AI Courses
  facts:
    - An AI Course groups several related topics into a structured sequence.
    - Describe what you want to learn and LearningClarity generates the course and its topics.
    - LearningClarity can suggest the best order in which to study the topics.
- key: learning-plans
  name: AI Learning Plans
  facts:
    - An AI Learning Plan is a full curriculum of several courses toward a broader goal, e.g. "Prepare for a career in data analysis".
    - LearningClarity generates the plan and its courses and can suggest the best order.
    - Structure is Learning Plan > Course > Topic > Subtopic.
- key: explain-mode
  name: Explain Mode
  facts:
    - An interactive AI tutor that teaches a subtopic page by page; select Next to continue at your own pace.
    - Each lesson is written once and saved. Unfinished lessons reopen at the page where you stopped; finished lessons can be reread at any time.
    - The lesson appears as it is written, so you can start reading page 1 while the rest is prepared. An outline shows every planned page and a bar fills as the pages are written. You can leave and come back while it is prepared.
    - "On the topic page, a subtopic whose lesson is being written shows \"Writing lesson…\"."
    - "When you create a topic, course or learning plan you choose how familiar you are with it (from New to me to I know it well); every lesson in it is planned and written for that level, and the level cannot be changed later."
    - Do not mention an in-lesson level control (Foundation, Standard, Advanced); it is switched off.
    - Select a sentence, several sentences or a paragraph, or use the box at the end of the page for the whole page, then pick a tool. Each tool and option says what it does and what it costs before you use it.
    - Simplify rewrites the selected text or page in simpler words, step by step.
    - "Explain Further lists its options with a one-line description each, including Why it works, Worked example, Real-world use, Limits & mistakes and Connect; an option that does not fit the text stays listed, greyed, with the reason."
    - "Ask answers your own question about the lesson, and offers Check me (one quick question to check you understood) and Help me remember (a memory trick)."
    - Results appear right under the text you asked about; each one can be marked Helpful or Not helpful, added to your notes, or removed.
    - Highlight sentences as Key point or Confusing, and add notes; they are collected in "Your notes and answers" and can be downloaded with the lesson as a PDF ("Download my notebook").
    - Under every chart in a lesson, "Play with this chart" lets you change the chart yourself; it is free and uses no AI.
    - Knowledge Checks are questions during the lesson with feedback; after a wrong answer, "Try another question" gives a new one, and you can look back at the earlier questions and your answers.
    - "\"I know this\" lets you skip a page you already know."
    - "At the end of the lesson, a wrap-up shows how many knowledge checks you answered correctly on the first try, how you did on each part, the page worth another look, and your notes. It then suggests your next step: the next subtopic, a quiz, the exam, the podcast, Talk to This or the PDF."
    - Explanations and questions are adapted to the learner's age and level.
    - For now the new lesson experience (saved lessons, level control, the redesigned tools, the wrap-up) is in the web app; it is coming to the iPhone and Android apps later.
- key: visualize
  name: Visualize
  facts:
    - "In Explain Mode, Visualize offers two options for the selected text or page: Illustration (an AI-drawn image of the idea, which you can enlarge) and Watch a video (short YouTube videos about it, played in the lesson)."
    - Illustrations are labelled in the topic's language.
    - Do not mention diagrams, charts or interactive graphs as Visualize options; they are not offered.
- key: listen
  name: Listen (audio narration)
  facts:
    - In Explain Mode, Listen reads the current explanation aloud.
    - Useful for auditory learners and studying away from the screen.
- key: podcasts
  name: AI podcasts
  facts:
    - Turn a topic or a single subtopic into an AI-generated podcast episode: a two-voice conversation between a host and an expert guest.
    - Choose from preset episode lengths; topic-level episodes can be longer than subtopic-level ones.
    - The episode follows the topic's language; voices are optimised for English, other languages may carry a slight accent.
    - Episodes are generated in the background; an "AI job complete" notification says when one is ready.
    - An episode is generated once and saved, so it can be replayed later without generating it again.
    - Episodes play in a small docked player that keeps playing while you move to other parts of the app.
- key: talk-to-this
  name: Talk to This (live voice tutor)
  facts:
    - Opens a live voice conversation with an AI tutor about the material you are studying.
    - Speak or type; the tutor always replies aloud. A transcript can be kept.
    - Credits are based on conversation length; unused reserved credits are returned.
    - Available on all platforms - the web app, iPhone and Android.
    - The tutor replies in the topic's language.
- key: quiz-mode
  name: Quiz Mode
  facts:
    - Low-pressure practice: choose the subtopics and the question types.
    - An "I don't know" option gives a more accurate picture than guessing.
    - Ask why an answer is correct or incorrect.
    - Results show a score, a breakdown of correct, incorrect and "I don't know" answers, and a mastery level.
- key: exam-mode
  name: Exam Mode
  facts:
    - A formal assessment on a single topic or a whole course.
    - Settings - scope, question types, difficulty (Medium, Hard or Random), untimed or timed, number of questions.
    - Results - score, full question review, an AI performance summary of strengths and areas to revisit, mastery level.
- key: certificates
  name: Certificates
  facts:
    - Qualifying exam results earn a certificate for the topic or course.
    - A supervisor following the learner is notified when a certificate is earned.
- key: streaks-achievements
  name: Streaks and achievements
  facts:
    - Current streak counts consecutive days of learning activity; longest streak records the personal best; optional streak reminders.
    - 16 achievements with rarity levels (Common to Legendary), six of them hidden.
    - Examples - First Topic, Quiz Perfect (100% on a quiz), Exam Excellence (90%+ on an exam), 7-Day Streak, 30-Day Streak, Quiz Veteran (10 quizzes).
- key: progress
  name: Progress tracking and mastery
  facts:
    - Progress is tracked at every level - subtopics, topics, courses, plans, quiz and exam history, mastery levels.
    - The three modes Explain, Quiz and Exam take you from first understanding to verified mastery; you can enter any mode directly.
    - Every subtopic shows its mastery as Solid, Shaky or Needs revision, based on your answers in lessons, quizzes and exams.
- key: revise
  name: Revise what you missed
  facts:
    - After a quiz or an exam, each weak area has a Revise button, and Revise all works through every weak subtopic.
    - "Revising has three steps: review the saved lesson, with the pages that cover your missed questions marked; answer new questions, one per screen, with instant feedback; then see the result. Getting half or more right brings the subtopic back to good standing."
    - You can revise again with new questions as often as you like, or revise all weak subtopics one after another.
    - The Review list on the dashboard collects what you missed in lessons, quizzes and exams, with the date of the next review; opening a saved lesson is free.
    - For now Revise and the Review list are in the web app; they are coming to the iPhone and Android apps later.
- key: learning-insights
  name: Learning insights
  facts:
    - Quiz results include personalised insights - an assessment of your performance with tips on how to improve.
    - Exam results include insights that highlight your strong areas and the topics that need more attention, alongside the performance assessment.
    - In an Organization Workspace, the Insights section gives authorised members read-only views of learning across the organization.
    - Team progress shows who has started, finished or fallen behind on assigned content.
    - Exam results roll up completion, scores and pass rates for assigned exams.
    - Learning results - pick one content item and see every member it reached and how they did.
    - Usage and spend tracks credit spend across units; the spend dashboard can be emailed on a schedule, and budget alerts warn when the credit pool or a unit budget runs low.
    - Access to each Insights view is controlled by the member's role and permissions.
- key: sharing
  name: Sharing topics, courses and plans
  facts:
    - Share any topic, course or plan you created with another LearningClarity user by email.
    - The recipient previews it and accepts or declines; on accepting they get an independent copy and their own progress.
    - You are notified when a share is accepted; pending shares can be cancelled.
    - Only content you created can be shared; shared copies cannot be shared onward.
    - The recipient's copy includes the lessons already written, so they can start reading straight away.
- key: supervision
  name: Supervision for parents and teachers
  facts:
    - Supervision can start from either side - a parent, teacher or mentor sends a request to the learner's account email, or the learner invites a supervisor by email; nothing is shared until the other side accepts.
    - Scheduled email progress reports - weekly, every two weeks or monthly, at a chosen day, hour and time zone; or sent immediately.
    - Reports cover highlights, overview, topic, course and plan progress, recent quizzes and exams; written in the supervisor's app language (Arabic right-to-left).
    - Supervisors are notified when the request is accepted, when the learner earns a certificate, and when the learner has been inactive.
- key: languages
  name: Languages
  facts:
    - The app language is the user interface language; 7 options - Arabic, English, French, German, Italian, Portuguese, Spanish; changed in the user profile.
    - New topics, courses and plans default to the app language; you can change the learning language before creating them.
    - Explanations, quizzes, exams, diagrams and podcasts are in the chosen learning language, always in its formal, standard form.
    - Study one topic in Arabic and another in English.
- key: accessibility
  name: Accessibility
  facts:
    - Built to follow web accessibility best practices.
    - The app can be navigated with the keyboard.
    - Interactive elements are labelled, and the design uses strong contrast.
    - Listen reads explanations aloud, for studying away from the screen.
    - Do not claim compliance with a named standard (such as WCAG) or a certification.
- key: subscription
  name: Free first week and monthly plans
  facts:
    - Every new account gets one week of free use with a fair usage allowance, to try the platform before choosing a plan.
    - "After the free week, individuals choose a monthly or yearly plan: Bronze $3.99 a month or $45.99 a year; Silver (3x the Bronze allowance) $11.99 a month or $136.99 a year; Gold (8x the Bronze allowance) $31.99 a month or $363.99 a year. Prices are in US dollars."
    - For every plan, paying yearly costs less than twelve monthly payments.
    - The platform always shows the percentage of your allowance used, and every feature is clearly labelled when it uses your allowance.
    - "Need more in a month? Upgrade to a larger plan, or buy a one-off top-up for $4.99 that adds one Bronze-sized allowance; top-ups can be bought in multiples and are charged once, not every month."
    - Credits that existing users already bought keep working as before until they are used up.
    - Do not mention free credits, credit packs, "no subscription" or "credits never expire"; that pricing model was retired on 5 November 2026.
- key: referral
  name: Referral program
  facts:
    - Every user has a referral code; a friend who signs up with it gets 200 bonus credits.
    - When a referred friend makes their first purchase, the referrer receives a bonus of 10% of that purchase (first purchase only).
    - The referral bonus can be converted to cash on request.
    - A referral dashboard shows sign-ups, purchases and earnings.
- key: multi-device
  name: Web, iPhone and Android
  facts:
    - Available on the web, iOS and Android; sign in with Google, Microsoft, Apple or email.
    - Library, progress and your plan are shared across devices.
    - "The sign-in and sign-up screens show Continue with Google, Microsoft or Apple first, then Continue with email. When you sign up, you type your email twice, and the address is checked as you type (for example \"This address can receive email\")."
    - "Change your sign-in email from your profile (Change email): type the new address twice and your current password, then open the link sent to the new address within 24 hours. Until then you keep signing in with your current email; after you confirm, your other devices are signed out."
    - "If someone else changed your email, the message sent to your old address has a link to secure your account, which puts your old email back and signs out every device."
    - Changing your sign-in email is in the web app for now; accounts that sign in with Google, Microsoft or Apple manage their email there.
- key: age-adapted
  name: Age-adapted learning
  facts:
    - Onboarding collects date of birth; explanations, examples and questions are pitched at the learner's age.
