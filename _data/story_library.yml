# Story library for blog posts. Read with STORY_GUIDE.md and AGENT.md.
#
# Every idea is a HYPOTHETICAL scenario: the people, companies and results are fictional and must be labelled as such
# in the post. Product claims must come only from _data/capabilities.yml. Character names are suggestions; check
# they are not used by an earlier post (AGENT.md step 2) and replace them if they are.
#
# status:   idea      = ready to write
#           flagged   = needs product information or evidence first (see needs_info); do not write until resolved
#           scheduled = owner's story queued as a one-time scheduled task; do not write
#           published = already on the blog; do not repeat this angle
# A post written from an idea sets `story: <id>` in its front matter, which marks the idea as used.

covered:
  # Stories and angles already on the blog or scheduled. Keep new stories clearly different from these.
  - {id: lena-certificate-week, status: published, capability: certificates, angle: "First-time project lead goes from sign-up to a verifiable certificate in one week (countdown)"}
  - {id: clara-teacher-class, status: published, capability: supervision, angle: "Teacher shares a topic with her class, uses supervision reports to coach each student, class earns certificates"}
  - {id: joseph-sales-manager, status: published, capability: describe-topic, angle: "Top account executive promoted to sales manager with six days to prepare (owner's story)"}
  - {id: sarah-call-center-nps, status: published, capability: talk-to-this, angle: "Call-center agent prepares for an NPS contest and rehearses hard calls out loud (owner's story)"}
  - {id: nevine-mass-recruitment, status: scheduled, capability: describe-topic, angle: "HR recruiter staffs 50 vetted guards in six days (owner's story, 28 Oct 2026)"}
  - {id: tarek-currency-crisis, status: scheduled, capability: describe-topic, angle: "Plant accountant defends a cost-control plan during a currency crisis (owner's story, 30 Oct 2026)"}
  - {id: maya-mental-block, status: published, capability: explain-mode, angle: "Student stuck on a hard idea uses Simplify, then Visualize (owner's post)"}
  - {id: karim-career-change-plan, status: published, capability: learning-plans, angle: "Retail worker plans a move into data analysis with an AI Learning Plan"}
  - {id: notebooklm-study-routine, status: published, capability: progress, angle: "Daily study routine compared with NotebookLM (owner's post)"}
  - {id: explain-mode-intro, status: published, capability: explain-mode, angle: "Feature introduction: the step-by-step AI tutor"}
  - {id: podcast-intro, status: published, capability: podcasts, angle: "Feature introduction: turn any topic into a podcast"}
  - {id: own-pdfs-intro, status: published, capability: upload-material, angle: "Feature introduction: study your own PDFs"}
  - {id: ai-course-generator, status: published, capability: ai-courses, angle: "Guide: three situations for the AI course generator (parent, team, self-learner)"}
  - {id: describe-any-subject, status: published, capability: describe-topic, angle: "Guide: learn any subject by describing it"}
  - {id: visual-learning-diagrams, status: published, capability: visualize, angle: "Guide: three ways to study with diagrams"}
  - {id: learn-by-listening, status: published, capability: listen, angle: "Guide: study away from the screen with Listen"}
