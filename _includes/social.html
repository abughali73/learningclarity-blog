{%- assign st = site.data.i18n[include.lang] -%}
<nav class="social" aria-label="{{ st.follow_label }}">
  <p class="social-title">{{ st.follow_title }}</p>
  <ul class="social-list" dir="ltr">
    {%- for s in site.data.social %}
    <li><a href="{{ s.url }}" rel="noopener me" target="_blank">{{ s.name }}</a></li>
    {%- endfor %}
  </ul>
</nav>
