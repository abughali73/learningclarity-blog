    smiling young man in the blue hoodie, the headline, the paragraph, the Explain, Quiz, Exam and Learning Plan
    cards on the right, the four cards along the bottom, the books, the logo, the website address, the store badges,
    the colours, the lighting and the layout).
    1) In the "Upload Your Material" card, change the small grey line "Upload your notes, PDFs, or slides" to
    "Upload your notes, PDFs, or images". Spell it exactly.
    2) In the same card there are three file tiles: a red PDF tile, a blue Word tile with the letter W and an orange
    PowerPoint tile with the letter P. Keep the red PDF tile. Replace the Word tile with a white rounded tile showing
    a simple blue image icon (a picture of mountains and a sun), and replace the PowerPoint tile with a white rounded
    tile showing a simple blue text-document icon labelled "TXT", both in the same style, size and position.
    Do not add any other text, logos or icons.
